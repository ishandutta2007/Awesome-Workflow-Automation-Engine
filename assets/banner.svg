<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;overflow:hidden;">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; opacity: 0.4; }
    .pulse-circle { animation: pulse 3s ease-in-out infinite alternate; }
    @keyframes pulse {
      0% { r: 5px; opacity: 0.4; }
      100% { r: 8px; opacity: 0.9; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Technical Grid Background -->
  <g class="grid-layer">
    <line x1="100" y1="0" x2="100" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="360" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="360" class="grid-line" />
    <line x1="0" y1="90" x2="1200" y2="90" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="270" x2="1200" y2="270" class="grid-line" />
  </g>

  <!-- Dynamic / Animated Flow Circuit in Background -->
  <g opacity="0.35">
    <!-- Curved Pipeline Track 1 -->
    <path d="M -50 80 Q 250 20 450 80 T 950 60 T 1250 80" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="10s" repeatCount="indefinite" />
    </path>
    
    <!-- Curved Pipeline Track 2 -->
    <path d="M -50 280 Q 200 340 550 290 T 1000 320 T 1250 280" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="8s" repeatCount="indefinite" />
    </path>

    <!-- Orchestration Nodes & Beams in Background -->
    <!-- Node A -->
    <circle cx="120" cy="75" r="5" fill="#818cf8" class="pulse-circle" />
    <!-- Node B -->
    <circle cx="480" cy="80" r="6" fill="#38bdf8" />
    <!-- Node C -->
    <circle cx="920" cy="60" r="5" fill="#f472b6" class="pulse-circle" />
    <!-- Node D -->
    <circle cx="220" cy="300" r="6" fill="#06b6d4" />
    <!-- Node E -->
    <circle cx="680" cy="305" r="5" fill="#a855f7" class="pulse-circle" />
    <!-- Node F -->
    <circle cx="1060" cy="300" r="6" fill="#ec4899" />

    <!-- Flowing Particle 1 -->
    <circle r="4" fill="#38bdf8" filter="url(#softGlow)">
      <animateMotion path="M -50 80 Q 250 20 450 80 T 950 60 T 1250 80" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Flowing Particle 2 -->
    <circle r="4" fill="#ec4899" filter="url(#softGlow)">
      <animateMotion path="M 1250 280 T 1000 320 T 550 290 Q 200 340 -50 280" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Subdued Decorative Glow Orbs in Background -->
  <circle cx="200" cy="90" r="100" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="270" r="120" fill="#ec4899" opacity="0.1" filter="url(#glow)" />

  <!-- FOREGROUND CONTENT: Header, Badge, Titles, Subtitle, Tech Pills -->
  <!-- Top Category Tag / Badge -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="2">
      ⚡ ENTERPRISE &amp; OPEN SOURCE ECOSYSTEM
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5" filter="url(#softGlow)">
    Awesome Workflow Automation Engine
  </text>

  <!-- Subtitle -->
  <text x="600" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">
    BPMN Process Engines • Durable Execution Platforms • Self-Hosted Orchestration
  </text>

  <!-- Bottom Pills / Feature Cards in Foreground -->
  <g transform="translate(160, 230)">
    <!-- Pill 1: BPMN 2.0 Engines -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="260" height="64" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
      <circle cx="32" cy="32" r="14" fill="#3b82f6" fill-opacity="0.2" />
      <text x="32" y="37" font-family="sans-serif" font-size="14" fill="#60a5fa" text-anchor="middle">⚙️</text>
      <text x="60" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">BPMN 2.0 Engines</text>
      <text x="60" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Camunda • Flowable • Activiti</text>
    </g>

    <!-- Pill 2: Durable Execution -->
    <g transform="translate(310, 0)">
      <rect x="0" y="0" width="260" height="64" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
      <circle cx="32" cy="32" r="14" fill="#8b5cf6" fill-opacity="0.2" />
      <text x="32" y="37" font-family="sans-serif" font-size="14" fill="#c084fc" text-anchor="middle">🔄</text>
      <text x="60" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Durable Execution</text>
      <text x="60" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Temporal • Cadence • Inngest</text>
    </g>

    <!-- Pill 3: Low-Code & Data Orchestration -->
    <g transform="translate(620, 0)">
      <rect x="0" y="0" width="260" height="64" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
      <circle cx="32" cy="32" r="14" fill="#ec4899" fill-opacity="0.2" />
      <text x="32" y="37" font-family="sans-serif" font-size="14" fill="#f472b6" text-anchor="middle">🚀</text>
      <text x="60" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Visual &amp; Data Flows</text>
      <text x="60" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">n8n • Windmill • Airflow • Node-RED</text>
    </g>
  </g>
</svg>